on:
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'models/manifest.json'
      - '.github/workflows/reader-integration.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Versioned GitHub release containing the drop-37 v3 model asset'
        required: true
        default: 'v0.4.0'
        type: string

name: External reader integration

permissions: read-all

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    # Draft releases are visible only with push access. Keep this token in a
    # download-only job that never checks out or executes package/PR code.
    permissions:
      contents: write
    env:
      AMD_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || 'v0.4.0' }}
    steps:
      - name: Fetch the explicitly versioned model, including a private draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$AMD_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$AMD_RELEASE_TAG" '.[] | select(.tag_name == $tag) |
              .assets[] | select(.name == "amd_predictor_bundle_v3_drop37.rds") | .id')
          [[ "$asset_id" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            > "$RUNNER_TEMP/amd_predictor_bundle_v3_drop37.rds"
          echo '3407a5a55c30a70e150afaa16a52ee4f2c8d3ed265941f3af8c4cb9d0c99035f  '"$RUNNER_TEMP/amd_predictor_bundle_v3_drop37.rds" | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-drop37-reader
          path: ${{ runner.temp }}/amd_predictor_bundle_v3_drop37.rds
          retention-days: 1
          if-no-files-found: error
  reader-integration:
    needs: fetch-model
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Model releases are independent of documentation-only package patches.
      AMD_RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || 'v0.4.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::jsonlite
          needs: check
      - uses: actions/download-artifact@v4
        with:
          name: frozen-drop37-reader
          path: ${{ runner.temp }}
      - name: Verify the external model
        shell: Rscript {0}
        run: |
          manifest <- jsonlite::read_json("models/manifest.json", simplifyVector = TRUE)
          tag <- Sys.getenv("AMD_RELEASE_TAG")
          stopifnot(grepl("^v[0-9]+[.][0-9]+[.][0-9]+$", tag))
          model <- file.path(Sys.getenv("RUNNER_TEMP"), manifest$file)
          stopifnot(file.info(model)$size == manifest$bytes,
                    digest::digest(file = model, algo = "sha256") == manifest$sha256)
          writeLines(c(paste0("AMD_PREDICTOR_BUNDLE=", model),
                       paste0("AMD_PREDICTOR_SHA256=", manifest$sha256)),
                     Sys.getenv("GITHUB_ENV"), useBytes = TRUE)
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
